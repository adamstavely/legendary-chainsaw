<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-site-responsiveness">
  <title>Responsiveness</title>
  <defs>
    <filter id="tcs-site-responsiveness-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-site-responsiveness:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-site-responsiveness{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-site-responsiveness{color-scheme:light}
    .tcs-site-responsiveness .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-site-responsiveness .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-site-responsiveness .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-site-responsiveness .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-site-responsiveness .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-site-responsiveness .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="140" cy="154" rx="26" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-site-responsiveness-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="40" y="56" width="90" height="62" rx="7" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" d="M52 72 H98 M52 86 H84 M74 118 V132 M60 134 H90" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="120" y="76" width="38" height="66" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M130 92 H148 M130 104 H142 M134 132 H144" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
