<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-site-for-developers">
  <title>For Developers</title>
  <defs>
    <filter id="tcs-site-for-developers-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-site-for-developers:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-site-for-developers{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-site-for-developers{color-scheme:light}
    .tcs-site-for-developers .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-site-for-developers .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-site-for-developers .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-site-for-developers .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-site-for-developers .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-site-for-developers .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="154" rx="46" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-site-for-developers-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="line-fill" cx="46" cy="52" r="3.5" fill="#e6e9ee"/><circle class="line-fill" cx="58" cy="52" r="3.5" fill="#e6e9ee"/><circle class="line-fill" cx="70" cy="52" r="3.5" fill="#e6e9ee"/><path class="line" style="stroke-width:2" d="M30 64 H170" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="52" y="80" width="96" height="56" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M80 96 L68 108 L80 120 M120 96 L132 108 L120 120 M106 92 L94 124" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
