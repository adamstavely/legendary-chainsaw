<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-site-stock-photos">
  <title>Stock Photos</title>
  <defs>
    <filter id="tcs-site-stock-photos-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-site-stock-photos:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-site-stock-photos{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-site-stock-photos{color-scheme:light}
    .tcs-site-stock-photos .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-site-stock-photos .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-site-stock-photos .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-site-stock-photos .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-site-stock-photos .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="92" cy="156" rx="44" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-site-stock-photos-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="66" y="50" width="88" height="66" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="46" y="68" width="92" height="70" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M56 128 L80 102 L96 118 L108 108 L128 128" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink" cx="116" cy="88" r="7" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
