<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-site-best-practices">
  <title>Best Practices</title>
  <defs>
    <filter id="tcs-site-best-practices-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-site-best-practices:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-site-best-practices{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-site-best-practices{color-scheme:light}
    .tcs-site-best-practices .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-site-best-practices .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-site-best-practices .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-site-best-practices .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-site-best-practices .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-site-best-practices .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="156" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-site-best-practices-glow)"/>
  <rect class="tile" x="36" y="40" width="128" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub-box" d="M84 104 L74 142 L88 136 L96 148 L102 112 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub-box" d="M116 104 L126 142 L112 136 L104 148 L98 112 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" cx="100" cy="86" r="32" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="edge" cx="100" cy="86" r="22" fill="none" stroke="#8fb0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M89 86 L97 94 L112 78" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
