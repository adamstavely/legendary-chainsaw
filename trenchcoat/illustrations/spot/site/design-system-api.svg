<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-site-design-system-api">
  <title>Design System API</title>
  <defs>
    <filter id="tcs-site-design-system-api-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-site-design-system-api:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-site-design-system-api{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-site-design-system-api{color-scheme:light}
    .tcs-site-design-system-api .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-site-design-system-api .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-site-design-system-api .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-site-design-system-api .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-site-design-system-api .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-site-design-system-api .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="80" cy="154" rx="34" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-site-design-system-api-glow)"/>
