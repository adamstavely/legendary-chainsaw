<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-site-not-found">
  <title>Not Found</title>
  <defs>
    <filter id="tcs-site-not-found-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-site-not-found:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-site-not-found{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-site-not-found{color-scheme:light}
    .tcs-site-not-found .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-site-not-found .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-site-not-found .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-site-not-found .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-site-not-found .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-site-not-found .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="156" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-site-not-found-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="line-fill" cx="46" cy="52" r="3.5" fill="#e6e9ee"/><circle class="line-fill" cx="58" cy="52" r="3.5" fill="#e6e9ee"/><circle class="line-fill" cx="70" cy="52" r="3.5" fill="#e6e9ee"/><path class="line" style="stroke-width:2" d="M30 64 H170" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" cx="100" cy="104" r="28" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M88 94 L94 100 M94 94 L88 100 M106 94 L112 100 M112 94 L106 100" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M89 118 Q100 110 111 118" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
