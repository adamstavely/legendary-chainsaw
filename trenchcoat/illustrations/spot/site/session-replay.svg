<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-site-session-replay">
  <title>Session Replay</title>
  <defs>
    <filter id="tcs-site-session-replay-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-site-session-replay:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-site-session-replay{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-site-session-replay{color-scheme:light}
    .tcs-site-session-replay .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-site-session-replay .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-site-session-replay .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-site-session-replay .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-site-session-replay .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-site-session-replay .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-site-session-replay .ink-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-site-session-replay .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="128" cy="154" rx="28" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-site-session-replay-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="line-fill" cx="46" cy="52" r="3.5" fill="#e6e9ee"/><circle class="line-fill" cx="58" cy="52" r="3.5" fill="#e6e9ee"/><circle class="line-fill" cx="70" cy="52" r="3.5" fill="#e6e9ee"/><path class="line" style="stroke-width:2" d="M30 64 H170" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" style="stroke-dasharray:2 9" d="M48 132 Q58 84 86 100" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-box" d="M86 88 V116 L93 109 L99 122 L105 119 L99 106 L109 105 Z" fill="#ffffff" stroke="#2f5ea8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" cx="130" cy="112" r="24" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M120 104 A13 13 0 1 1 119 120" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M118 96 V105 H127" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
