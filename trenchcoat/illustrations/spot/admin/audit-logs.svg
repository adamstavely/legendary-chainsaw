<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-admin-audit-logs">
  <title>Audit Logs</title>
  <defs>
    <filter id="tcs-admin-audit-logs-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-admin-audit-logs:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-admin-audit-logs{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-admin-audit-logs{color-scheme:light}
    .tcs-admin-audit-logs .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-admin-audit-logs .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-admin-audit-logs .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-admin-audit-logs .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-audit-logs .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-audit-logs .ink-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-audit-logs .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="98" cy="156" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-admin-audit-logs-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="mark" x="60" y="52" width="80" height="96" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="82" y="46" width="36" height="14" rx="5" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="74" cy="78" r="3.5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="ink-fill" cx="74" cy="98" r="3.5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="ink-fill" cx="74" cy="118" r="3.5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M86 78 H124 M86 98 H116 M86 118 H110" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:7" d="M150 142 L160 152" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-box" cx="142" cy="134" r="12" fill="#ffffff" stroke="#2f5ea8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
