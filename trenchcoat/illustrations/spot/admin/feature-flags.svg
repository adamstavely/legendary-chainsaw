<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-admin-feature-flags">
  <title>Feature Flags</title>
  <defs>
    <filter id="tcs-admin-feature-flags-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-admin-feature-flags:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-admin-feature-flags{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-admin-feature-flags{color-scheme:light}
    .tcs-admin-feature-flags .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-admin-feature-flags .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-admin-feature-flags .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-admin-feature-flags .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-admin-feature-flags .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-feature-flags .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-feature-flags .ink-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-feature-flags .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="90" cy="154" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-admin-feature-flags-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub" style="stroke-width:5" d="M62 50 V144" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark" d="M64 54 H130 L116 74 L130 94 H64 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M78 74 H100" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink-box" x="96" y="114" width="56" height="26" rx="13" fill="#ffffff" stroke="#2f5ea8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="139" cy="127" r="7" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M44 144 H80" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
