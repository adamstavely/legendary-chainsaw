<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-admin-admin-dashboard">
  <title>Admin Dashboard</title>
  <defs>
    <filter id="tcs-admin-admin-dashboard-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-admin-admin-dashboard:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-admin-admin-dashboard{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-admin-admin-dashboard{color-scheme:light}
    .tcs-admin-admin-dashboard .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-admin-admin-dashboard .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-admin-admin-dashboard .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-admin-admin-dashboard .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-admin-admin-dashboard .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-admin-dashboard .ink-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-admin-dashboard .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="154" rx="50" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-admin-admin-dashboard-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="42" y="52" width="116" height="22" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M54 63 H100" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="42" y="82" width="116" height="34" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink" style="stroke-width:3.5" x="52" y="94" width="14" height="10" rx="5" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink" style="stroke-width:3.5" x="62" y="94" width="14" height="10" rx="5" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M86 99 H118" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-box" cx="140" cy="99" r="10" style="stroke-width:3.5" fill="#ffffff" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3" d="M140 93 V99 L144 102" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="42" y="124" width="116" height="22" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M54 135 H92" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
