<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-admin-pattern-status">
  <title>Pattern Status</title>
  <defs>
    <filter id="tcs-admin-pattern-status-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-admin-pattern-status:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-admin-pattern-status{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-admin-pattern-status{color-scheme:light}
    .tcs-admin-pattern-status .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-admin-pattern-status .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-admin-pattern-status .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-admin-pattern-status .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-admin-pattern-status .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-pattern-status .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="82" cy="154" rx="38" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-admin-pattern-status-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="mark" x="44" y="54" width="76" height="90" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M56 68 H108" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink" style="stroke-width:3.5" x="56" y="80" width="22" height="26" rx="4" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink" style="stroke-width:3.5" x="86" y="80" width="22" height="26" rx="4" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M56 120 H108 M56 132 H90" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="sub" style="stroke-width:6" cx="142" cy="78" r="13" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:6" d="M142 65 A13 13 0 1 1 129 78" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M132 116 H152 M132 132 H146" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
