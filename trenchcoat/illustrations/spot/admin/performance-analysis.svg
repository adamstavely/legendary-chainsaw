<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-admin-performance-analysis">
  <title>Performance Analysis</title>
  <defs>
    <filter id="tcs-admin-performance-analysis-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-admin-performance-analysis:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-admin-performance-analysis{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-admin-performance-analysis{color-scheme:light}
    .tcs-admin-performance-analysis .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-admin-performance-analysis .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-admin-performance-analysis .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-admin-performance-analysis .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-admin-performance-analysis .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-admin-performance-analysis .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="112" cy="154" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-admin-performance-analysis-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="line" style="stroke-width:2" d="M42 136 H158" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="48" y="100" width="18" height="36" rx="4" fill="#e6e9ee"/>
  <rect class="line-fill" x="74" y="88" width="18" height="48" rx="4" fill="#e6e9ee"/>
  <rect class="mark" x="100" y="56" width="22" height="80" rx="5" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M106 70 H116" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="130" y="94" width="18" height="42" rx="4" fill="#e6e9ee"/>
  <path class="ink" style="stroke-width:3.5;stroke-dasharray:6 7" d="M42 76 H158" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
