<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-guidelines-flashing">
  <title>Flashing</title>
  <defs>
    <filter id="tcs-guidelines-flashing-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-guidelines-flashing:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-guidelines-flashing{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-guidelines-flashing{color-scheme:light}
    .tcs-guidelines-flashing .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-guidelines-flashing .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-guidelines-flashing .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-flashing .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="156" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-guidelines-flashing-glow)"/>
  <rect class="tile" x="36" y="40" width="128" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="ink" d="M58 62 L66 70 M142 62 L134 70 M52 104 H62 M148 104 H138" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark" d="M110 52 L72 104 H96 L88 142 L128 88 H104 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
