<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-guidelines-multimedia-animation">
  <title>Multimedia Animation</title>
  <defs>
    <filter id="tcs-guidelines-multimedia-animation-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-guidelines-multimedia-animation:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-guidelines-multimedia-animation{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-guidelines-multimedia-animation{color-scheme:light}
    .tcs-guidelines-multimedia-animation .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-guidelines-multimedia-animation .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-guidelines-multimedia-animation .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-guidelines-multimedia-animation .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-multimedia-animation .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-multimedia-animation .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="154" rx="44" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-guidelines-multimedia-animation-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="mark" cx="100" cy="86" r="28" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-fill" d="M93 73 L113 86 L93 99 Z" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M46 132 H154" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M46 132 H92" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" style="stroke-width:3" cx="92" cy="132" r="7" fill="#dce8fb" stroke="#8fb0e8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
