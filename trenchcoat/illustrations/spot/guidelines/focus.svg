<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-guidelines-focus">
  <title>Focus</title>
  <defs>
    <filter id="tcs-guidelines-focus-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-guidelines-focus:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-guidelines-focus{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-guidelines-focus{color-scheme:light}
    .tcs-guidelines-focus .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-guidelines-focus .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-guidelines-focus .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-guidelines-focus .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-focus .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="154" rx="46" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-guidelines-focus-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="line" d="M50 66 H130" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="58" y="88" width="84" height="32" rx="16" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M82 104 H118" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink" style="stroke-width:4" x="49" y="79" width="102" height="50" rx="25" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
