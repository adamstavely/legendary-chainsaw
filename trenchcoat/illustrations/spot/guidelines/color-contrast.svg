<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-guidelines-color-contrast">
  <title>Color Contrast</title>
  <defs>
    <filter id="tcs-guidelines-color-contrast-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-guidelines-color-contrast:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-guidelines-color-contrast{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-guidelines-color-contrast{color-scheme:light}
    .tcs-guidelines-color-contrast .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-guidelines-color-contrast .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-guidelines-color-contrast .mark-line{stroke:light-dark(#dce8fb,#263a5c)}
    .tcs-guidelines-color-contrast .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-color-contrast .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-color-contrast .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="154" rx="48" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-guidelines-color-contrast-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="mark" x="46" y="60" width="54" height="72" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M59 120 L73 76 L87 120 M64 106 H82" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink-fill" x="104" y="60" width="52" height="72" rx="10" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark-line" d="M116 120 L130 76 L144 120 M121 106 H139" fill="none" stroke="#dce8fb" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
