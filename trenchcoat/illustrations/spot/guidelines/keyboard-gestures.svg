<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-guidelines-keyboard-gestures">
  <title>Keyboard Gestures</title>
  <defs>
    <filter id="tcs-guidelines-keyboard-gestures-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-guidelines-keyboard-gestures:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-guidelines-keyboard-gestures{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-guidelines-keyboard-gestures{color-scheme:light}
    .tcs-guidelines-keyboard-gestures .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-guidelines-keyboard-gestures .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-guidelines-keyboard-gestures .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-guidelines-keyboard-gestures .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-guidelines-keyboard-gestures .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-keyboard-gestures .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-keyboard-gestures .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="76" cy="152" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-guidelines-keyboard-gestures-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="mark" x="46" y="66" width="60" height="60" rx="12" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="edge" x="53" y="71" width="46" height="42" rx="9" fill="none" stroke="#8fb0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M88 92 H66 M74 84 L66 92 L74 100" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" style="stroke-dasharray:1 9" d="M120 130 Q150 130 150 96" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="120" cy="130" r="6" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="132" cy="122" r="4" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M140 112 Q150 108 150 80 M141 88 L150 78 L159 88" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
