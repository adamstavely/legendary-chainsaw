<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-guidelines-typography">
  <title>Typography</title>
  <defs>
    <filter id="tcs-guidelines-typography-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-guidelines-typography:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-guidelines-typography{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-guidelines-typography{color-scheme:light}
    .tcs-guidelines-typography .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-guidelines-typography .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-guidelines-typography .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-guidelines-typography .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-guidelines-typography .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-typography .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="76" cy="152" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-guidelines-typography-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="mark" x="44" y="58" width="64" height="76" rx="12" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:5" d="M58 122 L76 70 L94 122 M64 106 H88" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M122 72 H156 M122 88 H148 M122 104 H152" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" d="M122 122 H156" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
