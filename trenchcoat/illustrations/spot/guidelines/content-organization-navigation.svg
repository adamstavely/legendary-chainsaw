<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-guidelines-content-organization-navigation">
  <title>Content Organization Navigation</title>
  <defs>
    <filter id="tcs-guidelines-content-organization-navigation-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-guidelines-content-organization-navigation:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-guidelines-content-organization-navigation{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-guidelines-content-organization-navigation{color-scheme:light}
    .tcs-guidelines-content-organization-navigation .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-guidelines-content-organization-navigation .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-guidelines-content-organization-navigation .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-guidelines-content-organization-navigation .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-guidelines-content-organization-navigation .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="102" cy="152" rx="38" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-guidelines-content-organization-navigation-glow)"/>
  <rect class="tile" x="30" y="36" width="140" height="116" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="line" style="stroke-width:2" d="M30 62 H170" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M46 49 H64 M116 49 H134" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M80 49 H100" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="70" y="72" width="64" height="66" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M82 90 H122 M82 105 H112 M82 120 H118" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
