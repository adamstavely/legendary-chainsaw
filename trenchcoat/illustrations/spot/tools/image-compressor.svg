<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-tools-image-compressor">
  <title>Image Compressor</title>
  <defs>
    <filter id="tcs-tools-image-compressor-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-tools-image-compressor:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-tools-image-compressor{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-tools-image-compressor{color-scheme:light}
    .tcs-tools-image-compressor .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-tools-image-compressor .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-image-compressor .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-image-compressor .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-image-compressor .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="154" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-tools-image-compressor-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="mark" x="68" y="66" width="64" height="58" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M76 114 L92 96 L104 108 L112 100 L124 114" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="114" cy="82" r="5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M44 52 L58 66 M58 56 V66 H48" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M156 52 L142 66 M142 56 V66 H152" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M44 140 L58 126 M58 136 V126 H48" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M156 140 L142 126 M142 136 V126 H152" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
