<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-tools-font-subsetting">
  <title>Font Subsetting</title>
  <defs>
    <filter id="tcs-tools-font-subsetting-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-tools-font-subsetting:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-tools-font-subsetting{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-tools-font-subsetting{color-scheme:light}
    .tcs-tools-font-subsetting .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-tools-font-subsetting .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-tools-font-subsetting .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-tools-font-subsetting .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-font-subsetting .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-font-subsetting .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-font-subsetting .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="138" cy="154" rx="26" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-tools-font-subsetting-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="42" y="54" width="20" height="20" rx="5" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="68" y="54" width="20" height="20" rx="5" fill="#e6e9ee"/>
  <rect class="sub-box" x="94" y="54" width="20" height="20" rx="5" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="42" y="80" width="20" height="20" rx="5" fill="#e6e9ee"/>
  <rect class="sub-box" x="68" y="80" width="20" height="20" rx="5" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="94" y="80" width="20" height="20" rx="5" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="42" y="106" width="20" height="20" rx="5" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="68" y="106" width="20" height="20" rx="5" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="94" y="106" width="20" height="20" rx="5" fill="#e6e9ee"/>
