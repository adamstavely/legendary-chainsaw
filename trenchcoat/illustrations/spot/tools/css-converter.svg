<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-tools-css-converter">
  <title>CSS Converter</title>
  <defs>
    <filter id="tcs-tools-css-converter-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-tools-css-converter:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-tools-css-converter{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-tools-css-converter{color-scheme:light}
    .tcs-tools-css-converter .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-tools-css-converter .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-tools-css-converter .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-tools-css-converter .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-css-converter .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-css-converter .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="134" cy="154" rx="34" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-tools-css-converter-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="40" y="56" width="46" height="80" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M50 72 H76 M50 86 H70 M50 100 H76 M50 114 H66" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M92 88 H108 M103 83 L108 88 L103 93 M108 104 H92 M97 99 L92 104 L97 109" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="114" y="56" width="46" height="80" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M124 72 H148 M132 86 H150 M132 100 H146 M124 116 H136" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
