<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-tools-seo-tagging-generator">
  <title>SEO Tagging Generator</title>
  <defs>
    <filter id="tcs-tools-seo-tagging-generator-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-tools-seo-tagging-generator:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-tools-seo-tagging-generator{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-tools-seo-tagging-generator{color-scheme:light}
    .tcs-tools-seo-tagging-generator .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-tools-seo-tagging-generator .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-tools-seo-tagging-generator .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-tools-seo-tagging-generator .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-seo-tagging-generator .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-seo-tagging-generator .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="98" cy="154" rx="46" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-tools-seo-tagging-generator-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="sub" cx="140" cy="58" r="8" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" d="M146 64 L153 71" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M48 58 H118" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark" d="M58 76 H122 L150 104 L122 132 H58 Q48 132 48 122 V86 Q48 76 58 76 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink" style="stroke-width:3.5" cx="126" cy="104" r="6" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M76 94 L66 104 L76 114 M98 94 L108 104 L98 114" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
