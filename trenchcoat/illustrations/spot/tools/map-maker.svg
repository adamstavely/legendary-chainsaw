<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-tools-map-maker">
  <title>Map Maker</title>
  <defs>
    <filter id="tcs-tools-map-maker-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-tools-map-maker:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-tools-map-maker{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-tools-map-maker{color-scheme:light}
    .tcs-tools-map-maker .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-tools-map-maker .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-map-maker .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-map-maker .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-map-maker .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-map-maker .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="154" rx="50" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-tools-map-maker-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="mark" d="M44 64 L80 54 L120 64 L156 54 V128 L120 138 L80 128 L44 138 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M80 54 V128 M120 64 V138" fill="none" stroke="#8fb0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-dasharray:3 8" d="M62 112 Q90 66 132 84" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="62" cy="112" r="5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-fill" d="M138 92 Q126 80 126 72 A12 12 0 0 1 150 72 Q150 80 138 92 Z" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" style="stroke-width:0" cx="138" cy="72" r="4" fill="#dce8fb" stroke="#8fb0e8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
