<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-tools-documentation-generator">
  <title>Documentation Generator</title>
  <defs>
    <filter id="tcs-tools-documentation-generator-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-tools-documentation-generator:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-tools-documentation-generator{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-tools-documentation-generator{color-scheme:light}
    .tcs-tools-documentation-generator .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-tools-documentation-generator .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-tools-documentation-generator .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-tools-documentation-generator .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-documentation-generator .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-documentation-generator .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-documentation-generator .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="122" cy="154" rx="38" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-tools-documentation-generator-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="42" y="52" width="52" height="64" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" d="M58 74 L50 82 L58 90 M78 74 L86 82 L78 90 M71 72 L65 92" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark" d="M92 64 H138 L156 82 V144 H92 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M138 64 V82 H156" fill="none" stroke="#8fb0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M104 80 H126 M104 98 H144 M104 112 H138 M104 126 H130" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M58 122 Q60.8 129.2 68 132 Q60.8 134.8 58 142 Q55.2 134.8 48 132 Q55.2 129.2 58 122 Z" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
