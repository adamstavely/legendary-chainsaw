<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-tools-alt-text-generator">
  <title>Alt Text Generator</title>
  <defs>
    <filter id="tcs-tools-alt-text-generator-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-tools-alt-text-generator:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-tools-alt-text-generator{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-tools-alt-text-generator{color-scheme:light}
    .tcs-tools-alt-text-generator .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-tools-alt-text-generator .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-tools-alt-text-generator .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-tools-alt-text-generator .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-tools-alt-text-generator .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-alt-text-generator .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-tools-alt-text-generator .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="92" cy="154" rx="44" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-tools-alt-text-generator-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="mark" x="48" y="52" width="80" height="56" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M58 98 L78 78 L92 90 L102 82 L118 98" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="108" cy="66" r="5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub-box" d="M48 118 H126 Q132 118 132 124 V136 Q132 142 126 142 H64 L54 148 V142 H54 Q48 142 48 136 V124 Q48 118 54 118 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M60 130 H118" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M148 65 Q151.1 72.9 159 76 Q151.1 79.1 148 87 Q144.9 79.1 137 76 Q144.9 72.9 148 65 Z" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
