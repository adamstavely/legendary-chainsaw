<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-ai-safe-exploration">
  <title>Safe Exploration</title>
  <defs>
    <filter id="tcs-ai-safe-exploration-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-ai-safe-exploration:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-ai-safe-exploration{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-ai-safe-exploration{color-scheme:light}
    .tcs-ai-safe-exploration .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-ai-safe-exploration .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-ai-safe-exploration .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-ai-safe-exploration .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-ai-safe-exploration .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-ai-safe-exploration .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="120" cy="152" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-ai-safe-exploration-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="line-fill" cx="46" cy="134" r="6" fill="#e6e9ee"/>
  <path class="sub" style="stroke-dasharray:2 9" d="M46 134 Q58 108 76 122 Q92 134 98 112" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark" d="M120 60 L148 70 V96 Q148 120 120 134 Q92 120 92 96 V70 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M108 96 L117 105 L133 86" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
