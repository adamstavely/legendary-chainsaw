<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-ai-memory-personalization">
  <title>Memory Personalization</title>
  <defs>
    <filter id="tcs-ai-memory-personalization-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-ai-memory-personalization:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-ai-memory-personalization{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-ai-memory-personalization{color-scheme:light}
    .tcs-ai-memory-personalization .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-ai-memory-personalization .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-ai-memory-personalization .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-ai-memory-personalization .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-ai-memory-personalization .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="156" rx="44" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-ai-memory-personalization-glow)"/>
  <rect class="tile" x="36" y="40" width="128" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="ink" d="M56 80 H66 M56 96 H66 M56 112 H66 M134 80 H144 M134 96 H144 M134 112 H144 M84 52 V62 M100 52 V62 M116 52 V62 M84 130 V140 M100 130 V140 M116 130 V140" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="66" y="62" width="68" height="68" rx="14" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-fill" d="M100 110 C86 101 83 90 90 86 C95 83 99 86 100 90 C101 86 105 83 110 86 C117 90 114 101 100 110 Z" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
