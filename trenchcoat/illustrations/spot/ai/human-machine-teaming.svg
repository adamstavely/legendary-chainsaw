  <path class="sub-box" d="M44 128 Q44 102 64 102 Q84 102 84 128 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M90 104 H108 M95 99 L90 104 L95 109 M103 99 L108 104 L103 109" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="114" y="72" width="38" height="34" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
