<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-ai-human-machine-teaming">
  <title>Human Machine Teaming</title>
  <defs>
    <filter id="tcs-ai-human-machine-teaming-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-ai-human-machine-teaming:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-ai-human-machine-teaming{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-ai-human-machine-teaming{color-scheme:light}
    .tcs-ai-human-machine-teaming .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-ai-human-machine-teaming .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-ai-human-machine-teaming .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-ai-human-machine-teaming .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-ai-human-machine-teaming .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-ai-human-machine-teaming .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="132" cy="152" rx="32" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-ai-human-machine-teaming-glow)"/>
