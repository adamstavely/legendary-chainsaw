<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-principles-design-for-all">
  <title>Design for All</title>
  <defs>
    <filter id="tcs-principles-design-for-all-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-principles-design-for-all:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-principles-design-for-all{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-principles-design-for-all{color-scheme:light}
    .tcs-principles-design-for-all .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-principles-design-for-all .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-principles-design-for-all .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-principles-design-for-all .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-principles-design-for-all .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="152" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-principles-design-for-all-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="mark" cx="100" cy="96" r="38" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="100" cy="74" r="6" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M78 88 L100 92 L122 88 M100 92 V108 L90 124 M100 108 L110 124" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
