  <path class="sub" d="M47 87 H63 M47 103 H58" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="85" y="76" width="30" height="40" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:4" d="M92 87 H108 M92 103 H103" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
