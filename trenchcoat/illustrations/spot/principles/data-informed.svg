<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-principles-data-informed">
  <title>Data Informed</title>
  <defs>
    <filter id="tcs-principles-data-informed-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-principles-data-informed:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-principles-data-informed{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-principles-data-informed{color-scheme:light}
    .tcs-principles-data-informed .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-principles-data-informed .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-principles-data-informed .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-principles-data-informed .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-principles-data-informed .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-principles-data-informed .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="124" cy="150" rx="32" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-principles-data-informed-glow)"/>
