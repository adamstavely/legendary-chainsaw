<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-data-viz">
  <title>Data Viz</title>
  <defs>
    <filter id="tcs-foundations-data-viz-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-data-viz:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-data-viz{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-data-viz{color-scheme:light}
    .tcs-foundations-data-viz .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-data-viz .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-foundations-data-viz .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-data-viz .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-data-viz .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-data-viz .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-data-viz .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="76" cy="150" rx="34" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-data-viz-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="mark" cx="76" cy="96" r="31" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="sub-box" cx="76" cy="96" r="13" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:8;stroke-linecap:butt" d="M76 74 A22 22 0 0 1 97.4 101" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink-fill" x="118" y="78" width="10" height="10" rx="2" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M136 83 H154" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="118" y="104" width="10" height="10" rx="2" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M136 109 H150" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
