<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-fonts">
  <title>Fonts</title>
  <defs>
    <filter id="tcs-foundations-fonts-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-fonts:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-fonts{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-fonts{color-scheme:light}
    .tcs-foundations-fonts .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-fonts .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-foundations-fonts .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-fonts .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-fonts .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="94" cy="152" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-fonts-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="line" d="M46 62 H154 M126 84 H154 M126 102 H148 M46 134 H96" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:8" d="M111 115 L130 134" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" cx="90" cy="96" r="27" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M80 107 L90 84 L100 107 M84 99 H96" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
