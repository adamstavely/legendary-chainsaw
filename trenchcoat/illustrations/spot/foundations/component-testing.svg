<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-component-testing">
  <title>Component Testing</title>
  <defs>
    <filter id="tcs-foundations-component-testing-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-component-testing:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-component-testing{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-component-testing{color-scheme:light}
    .tcs-foundations-component-testing .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-component-testing .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-foundations-component-testing .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-component-testing .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-component-testing .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-component-testing .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-component-testing .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-component-testing .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="126" cy="150" rx="28" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-component-testing-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="ink" style="stroke-width:4" d="M44 70 L49 75 L58 66 M44 96 L49 101 L58 92" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M66 70 H92 M66 96 H88 M66 122 H90" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="44" y="115" width="13" height="13" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark" d="M118 64 H134 V86 L148 124 Q150 132 142 132 H110 Q102 132 104 124 L118 86 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M113 64 H139" fill="none" stroke="#8fb0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M110 114 H142" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="122" cy="102" r="3" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="ink-fill" cx="131" cy="94" r="2.5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
