<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-internal-seals">
  <title>Internal Seals</title>
  <defs>
    <filter id="tcs-foundations-internal-seals-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-internal-seals:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-internal-seals{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-internal-seals{color-scheme:light}
    .tcs-foundations-internal-seals .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-internal-seals .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-internal-seals .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-internal-seals .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-internal-seals .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-internal-seals .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-internal-seals .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="84" cy="150" rx="32" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-internal-seals-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="sub-box" cx="132" cy="54" r="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="127" y="61" width="10" height="13" rx="2" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="112" y="74" width="40" height="13" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" d="M124 96 L118 102 M140 96 L146 102" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" cx="82" cy="110" r="27" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink" style="stroke-width:3" cx="82" cy="110" r="18" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-fill" d="M82.0 101.0 L84.4 106.8 L90.6 107.2 L85.8 111.2 L87.3 117.3 L82.0 114.0 L76.7 117.3 L78.2 111.2 L73.4 107.2 L79.6 106.8 Z" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
