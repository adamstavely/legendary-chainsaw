<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-dashboard-types">
  <title>Dashboard Types</title>
  <defs>
    <filter id="tcs-foundations-dashboard-types-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-dashboard-types:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-dashboard-types{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-dashboard-types{color-scheme:light}
    .tcs-foundations-dashboard-types .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-dashboard-types .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-foundations-dashboard-types .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-dashboard-types .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-dashboard-types .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-dashboard-types .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="131" cy="150" rx="30" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-dashboard-types-glow)"/>
  <rect class="tile" x="30" y="48" width="140" height="96" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="42" y="62" width="54" height="68" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M52 78 H86 M52 94 H78 M52 110 H86" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="104" y="62" width="54" height="68" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:6" d="M118 118 V104 M131 118 V88 M144 118 V97" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
