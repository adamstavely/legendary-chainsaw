<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-token-studio">
  <title>Token Studio</title>
  <defs>
    <filter id="tcs-foundations-token-studio-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-token-studio:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-token-studio{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-token-studio{color-scheme:light}
    .tcs-foundations-token-studio .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-token-studio .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-token-studio .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-token-studio .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-token-studio .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-token-studio .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="70" cy="152" rx="32" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-token-studio-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="edge" d="M98 96 C112 96 114 63 128 63 M98 96 H128 M98 96 C112 96 114 129 128 129" fill="none" stroke="#8fb0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="42" y="68" width="56" height="56" rx="12" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M63 80 Q57 80 57 86 V91 Q57 96 52 96 Q57 96 57 101 V106 Q57 112 63 112 M77 80 Q83 80 83 86 V91 Q83 96 88 96 Q83 96 83 101 V106 Q83 112 77 112" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="128" y="52" width="30" height="22" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="128" y="85" width="30" height="22" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="128" y="118" width="30" height="22" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
