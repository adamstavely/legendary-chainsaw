<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-country-flags">
  <title>Country Flags</title>
  <defs>
    <filter id="tcs-foundations-country-flags-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-country-flags:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-country-flags{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-country-flags{color-scheme:light}
    .tcs-foundations-country-flags .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-country-flags .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-foundations-country-flags .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-country-flags .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-country-flags .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-country-flags .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="102" cy="150" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-country-flags-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub" style="stroke-width:5" d="M58 64 V136" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="58" cy="60" r="4" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mark" d="M58 66 Q80 58 100 68 Q120 78 144 70 V110 Q120 118 100 108 Q80 98 58 106 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="98" cy="88" r="9" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M42 136 H74" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
