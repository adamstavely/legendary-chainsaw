<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-typography">
  <title>Typography</title>
  <defs>
    <filter id="tcs-foundations-typography-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-typography:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-typography{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-typography{color-scheme:light}
    .tcs-foundations-typography .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-typography .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-typography .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-typography .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-typography .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="130" cy="150" rx="30" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-typography-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub" style="stroke-width:3" d="M46 132 L53 114 L60 132 M48.5 126 H57.5" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" style="stroke-width:4.5" d="M70 132 L82 100 L94 132 M74.5 121 H89.5" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="104" y="62" width="52" height="70" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:5.5" d="M116 120 L130 82 L144 120 M121 107 H139" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" style="stroke-width:3" d="M42 138 H158" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
