<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-illustrations">
  <title>Illustrations</title>
  <defs>
    <filter id="tcs-foundations-illustrations-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-illustrations:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-illustrations{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-illustrations{color-scheme:light}
    .tcs-foundations-illustrations .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-illustrations .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-illustrations .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-illustrations .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-illustrations .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="150" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-illustrations-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub" style="stroke-width:5" d="M78 116 L66 140 M122 116 L134 140 M100 116 V140" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="54" y="52" width="92" height="66" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink" cx="124" cy="72" r="6" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M64 108 L84 86 L98 100 L110 90 L136 108" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
