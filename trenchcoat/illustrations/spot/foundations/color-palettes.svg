<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-color-palettes">
  <title>Color Palettes</title>
  <defs>
    <filter id="tcs-foundations-color-palettes-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-color-palettes:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-color-palettes{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-color-palettes{color-scheme:light}
    .tcs-foundations-color-palettes .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-color-palettes .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-foundations-color-palettes .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-color-palettes .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-color-palettes .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-color-palettes .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="114" cy="150" rx="28" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-color-palettes-glow)"/>
  <rect class="tile" x="30" y="48" width="140" height="96" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="40" y="72" width="24" height="48" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="68" y="72" width="24" height="48" rx="6" fill="#e6e9ee"/>
  <rect class="mark" x="98" y="58" width="32" height="76" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M106 116 L112 122 L123 110" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="136" y="72" width="24" height="48" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
