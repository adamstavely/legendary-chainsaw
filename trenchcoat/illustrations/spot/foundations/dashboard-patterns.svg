<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-foundations-dashboard-patterns">
  <title>Dashboard Patterns</title>
  <defs>
    <filter id="tcs-foundations-dashboard-patterns-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-foundations-dashboard-patterns:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-foundations-dashboard-patterns{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-foundations-dashboard-patterns{color-scheme:light}
    .tcs-foundations-dashboard-patterns .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-foundations-dashboard-patterns .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-foundations-dashboard-patterns .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-dashboard-patterns .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-foundations-dashboard-patterns .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-dashboard-patterns .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-dashboard-patterns .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="156" rx="44" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-foundations-dashboard-patterns-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="44" y="52" width="34" height="28" rx="7" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M52 66 H70" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="83" y="52" width="34" height="28" rx="7" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M90 72 L97 64 L103 68 L110 60 M104 60 H110 V66" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="122" y="52" width="34" height="28" rx="7" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M130 66 H148" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="44" y="90" width="112" height="50" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" style="stroke-width:4" d="M54 128 L74 114 L92 120 L114 102 L146 108" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
