    .tcs-foundations-token-relationships .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-token-relationships .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-foundations-token-relationships .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-token-relationships .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-foundations-token-relationships .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
