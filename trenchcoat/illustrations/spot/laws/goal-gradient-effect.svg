<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-laws-goal-gradient-effect">
  <title>Goal Gradient Effect</title>
  <defs>
    <filter id="tcs-laws-goal-gradient-effect-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-laws-goal-gradient-effect:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-laws-goal-gradient-effect{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-laws-goal-gradient-effect{color-scheme:light}
    .tcs-laws-goal-gradient-effect .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-laws-goal-gradient-effect .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-laws-goal-gradient-effect .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-laws-goal-gradient-effect .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-laws-goal-gradient-effect .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-laws-goal-gradient-effect .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-laws-goal-gradient-effect .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="88" cy="150" rx="40" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-laws-goal-gradient-effect-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="line" d="M50 70 H104" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M140 100 V58" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-fill" d="M140 58 L162 66 L140 74 Z" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="46" y="106" width="104" height="22" rx="11" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="46" y="106" width="82" height="22" rx="11" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M96 111 L102 117 L96 123 M108 111 L114 117 L108 123" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
