<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-laws-serial-position-effect">
  <title>Serial Position Effect</title>
  <defs>
    <filter id="tcs-laws-serial-position-effect-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-laws-serial-position-effect:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-laws-serial-position-effect{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-laws-serial-position-effect{color-scheme:light}
    .tcs-laws-serial-position-effect .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-laws-serial-position-effect .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-laws-serial-position-effect .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-laws-serial-position-effect .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-laws-serial-position-effect .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="154" rx="46" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-laws-serial-position-effect-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="mark" x="50" y="50" width="100" height="14" rx="7" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:4" d="M62 57 H104" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="50" y="71" width="100" height="14" rx="7" fill="#e6e9ee"/>
  <rect class="line-fill" x="50" y="92" width="100" height="14" rx="7" fill="#e6e9ee"/>
  <rect class="line-fill" x="50" y="113" width="100" height="14" rx="7" fill="#e6e9ee"/>
  <rect class="mark" x="50" y="134" width="100" height="14" rx="7" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:4" d="M62 141 H112" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
