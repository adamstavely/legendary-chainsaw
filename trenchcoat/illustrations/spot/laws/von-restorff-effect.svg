<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-laws-von-restorff-effect">
  <title>Von Restorff Effect</title>
  <defs>
    <filter id="tcs-laws-von-restorff-effect-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-laws-von-restorff-effect:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-laws-von-restorff-effect{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-laws-von-restorff-effect{color-scheme:light}
    .tcs-laws-von-restorff-effect .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-laws-von-restorff-effect .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-laws-von-restorff-effect .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-laws-von-restorff-effect .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-laws-von-restorff-effect .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="146" rx="28" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-laws-von-restorff-effect-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="sub-box" cx="44" cy="96" r="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="sub-box" cx="66" cy="96" r="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="83" y="79" width="34" height="34" rx="9" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-fill" d="M100 87 L102.4 92.8 L108.6 93.2 L103.8 97.2 L105.3 103.3 L100 100 L94.7 103.3 L96.2 97.2 L91.4 93.2 L97.6 92.8 Z" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="sub-box" cx="134" cy="96" r="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="sub-box" cx="156" cy="96" r="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
