  <rect class="mark" x="106" y="70" width="52" height="56" rx="12" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:6" d="M143 98 H149 M139.8 105.8 L144 110 M132 109 V115 M124.2 105.8 L120 110 M121 98 H115 M124.2 90.2 L120 86 M132 87 V81 M139.8 90.2 L144 86" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
