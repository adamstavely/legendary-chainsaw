<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-laws-jakobs-law">
  <title>Jakob's Law</title>
  <defs>
    <filter id="tcs-laws-jakobs-law-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-laws-jakobs-law:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-laws-jakobs-law{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-laws-jakobs-law{color-scheme:light}
    .tcs-laws-jakobs-law .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-laws-jakobs-law .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-laws-jakobs-law .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-laws-jakobs-law .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-laws-jakobs-law .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-laws-jakobs-law .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-laws-jakobs-law .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-laws-jakobs-law .ink-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-laws-jakobs-law .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="132" cy="150" rx="32" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-laws-jakobs-law-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="42" y="58" width="52" height="76" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" d="M42 72 H94" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="50" y="80" width="36" height="14" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M52 106 H84 M52 120 H74" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="106" y="58" width="52" height="76" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" d="M106 72 H158" fill="none" stroke="#8fb0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink-box" x="114" y="80" width="36" height="14" rx="4" fill="#ffffff" stroke="#2f5ea8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M116 106 H148 M116 120 H138" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
