  <circle class="line-fill" cx="148" cy="68" r="4" fill="#e6e9ee"/>
  <rect class="mark" x="42" y="92" width="34" height="30" rx="12" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
