<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-references-units-of-measure">
  <title>Units of Measure</title>
  <defs>
    <filter id="tcs-references-units-of-measure-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-references-units-of-measure:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-references-units-of-measure{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-references-units-of-measure{color-scheme:light}
    .tcs-references-units-of-measure .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-references-units-of-measure .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-references-units-of-measure .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-references-units-of-measure .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-references-units-of-measure .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="150" rx="52" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-references-units-of-measure-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub" d="M46 64 H154 M46 57 V71 M154 57 V71" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="38" y="82" width="124" height="42" rx="8" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M52 84 V106 M64 84 V96 M76 84 V106 M88 84 V96 M100 84 V106 M112 84 V96 M124 84 V106 M136 84 V96 M148 84 V106" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
