<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-references-jaws-commands">
  <title>JAWS Commands</title>
  <defs>
    <filter id="tcs-references-jaws-commands-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-references-jaws-commands:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-references-jaws-commands{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-references-jaws-commands{color-scheme:light}
    .tcs-references-jaws-commands .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-references-jaws-commands .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-references-jaws-commands .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-references-jaws-commands .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-references-jaws-commands .edge{stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-references-jaws-commands .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-references-jaws-commands .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="72" cy="152" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-references-jaws-commands-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub-box" d="M114 56 H148 Q158 56 158 66 V84 Q158 94 148 94 H132 L120 104 L122 94 H114 Q104 94 104 84 V66 Q104 56 114 56 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" style="stroke-width:5" d="M116 70 H146 M116 81 H136" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="42" y="80" width="60" height="56" rx="12" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="edge" x="49" y="85" width="46" height="40" rx="9" fill="none" stroke="#8fb0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M84 94 V106 H62 M69 99 L62 106 L69 113" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
