  <rect class="sub" style="stroke-width:2;stroke-dasharray:4 4" x="44" y="58" width="68" height="64" rx="4" fill="none" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="52" y="66" width="52" height="48" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" style="stroke-width:2.5" x="40" y="54" width="8" height="8" rx="2" fill="#ffffff" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" style="stroke-width:2.5" x="108" y="54" width="8" height="8" rx="2" fill="#ffffff" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" style="stroke-width:2.5" x="40" y="118" width="8" height="8" rx="2" fill="#ffffff" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" style="stroke-width:2.5" x="108" y="118" width="8" height="8" rx="2" fill="#ffffff" stroke="#c9ced6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-box" d="M128 80 H152 L160 106 L140 138 L120 106 Z" fill="#ffffff" stroke="#2f5ea8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M140 137 V118" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="140" cy="113" r="3.5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
