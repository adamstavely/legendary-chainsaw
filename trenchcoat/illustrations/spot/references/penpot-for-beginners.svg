<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-references-penpot-for-beginners">
  <title>Penpot for Beginners</title>
  <defs>
    <filter id="tcs-references-penpot-for-beginners-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-references-penpot-for-beginners:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-references-penpot-for-beginners{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-references-penpot-for-beginners{color-scheme:light}
    .tcs-references-penpot-for-beginners .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-references-penpot-for-beginners .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-references-penpot-for-beginners .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-references-penpot-for-beginners .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-references-penpot-for-beginners .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-references-penpot-for-beginners .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-references-penpot-for-beginners .ink-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-references-penpot-for-beginners .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="78" cy="150" rx="38" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-references-penpot-for-beginners-glow)"/>
