<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-patterns-data-visualization">
  <title>Data Visualization</title>
  <defs>
    <filter id="tcs-patterns-data-visualization-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-patterns-data-visualization:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-patterns-data-visualization{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-patterns-data-visualization{color-scheme:light}
    .tcs-patterns-data-visualization .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-patterns-data-visualization .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-patterns-data-visualization .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-patterns-data-visualization .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-patterns-data-visualization .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-patterns-data-visualization .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-patterns-data-visualization .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="112" cy="154" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-patterns-data-visualization-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub" d="M44 138 H156" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="50" y="106" width="18" height="30" rx="4" fill="#e6e9ee"/>
  <rect class="line-fill" x="76" y="90" width="18" height="46" rx="4" fill="#e6e9ee"/>
  <rect class="mark" x="102" y="66" width="20" height="70" rx="5" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="line-fill" x="130" y="98" width="18" height="38" rx="4" fill="#e6e9ee"/>
  <path class="ink" d="M59 92 L85 76 L112 54 L139 82" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="112" cy="54" r="3.5" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
