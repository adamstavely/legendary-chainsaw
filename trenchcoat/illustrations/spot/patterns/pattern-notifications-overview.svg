<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-patterns-pattern-notifications-overview">
  <title>Pattern Notifications Overview</title>
  <defs>
    <filter id="tcs-patterns-pattern-notifications-overview-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-patterns-pattern-notifications-overview:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-patterns-pattern-notifications-overview{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-patterns-pattern-notifications-overview{color-scheme:light}
    .tcs-patterns-pattern-notifications-overview .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-patterns-pattern-notifications-overview .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-patterns-pattern-notifications-overview .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-patterns-pattern-notifications-overview .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-patterns-pattern-notifications-overview .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="150" rx="36" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-patterns-pattern-notifications-overview-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="mark" d="M100 60 C84 60 76 72 76 88 V106 L66 120 H134 L124 106 V88 C124 72 116 60 100 60 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M100 52 V60 M92 128 Q100 136 108 128" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="126" cy="66" r="8" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
