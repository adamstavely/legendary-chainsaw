<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-research-journey-maps">
  <title>Journey Maps</title>
  <defs>
    <filter id="tcs-research-journey-maps-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-research-journey-maps:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-research-journey-maps{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-research-journey-maps{color-scheme:light}
    .tcs-research-journey-maps .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-research-journey-maps .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-research-journey-maps .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-research-journey-maps .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-research-journey-maps .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-journey-maps .ink-fill{fill:light-dark(#2f5ea8,#cfdffb);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-journey-maps .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="140" cy="152" rx="30" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-research-journey-maps-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub" style="stroke-dasharray:2 9" d="M48 126 Q66 82 88 108 Q108 132 128 98" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="sub-box" cx="48" cy="126" r="7" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle class="sub-box" cx="88" cy="108" r="7" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" cx="140" cy="80" r="22" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="133" cy="75" r="2.8" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="ink-fill" cx="147" cy="75" r="2.8" fill="#2f5ea8" stroke="#2f5ea8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M131 86 Q140 94 149 86" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
