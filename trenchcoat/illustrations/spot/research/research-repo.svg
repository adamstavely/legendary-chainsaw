<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-research-research-repo">
  <title>Research Repo</title>
  <defs>
    <filter id="tcs-research-research-repo-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-research-research-repo:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-research-research-repo{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-research-research-repo{color-scheme:light}
    .tcs-research-research-repo .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-research-research-repo .sub{stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-research-research-repo .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-research-research-repo .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-research-research-repo .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-research-repo .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="104" cy="158" rx="46" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-research-research-repo-glow)"/>
  <rect class="tile" x="56" y="40" width="88" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <rect class="sub-box" x="66" y="52" width="68" height="26" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" d="M92 65 H108" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="sub-box" x="66" y="118" width="68" height="24" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="sub" d="M92 130 H108" fill="none" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="58" y="86" width="96" height="26" rx="6" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M94 99 H118" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
