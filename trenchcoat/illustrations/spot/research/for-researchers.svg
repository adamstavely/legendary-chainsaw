<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-research-for-researchers">
  <title>For Researchers</title>
  <defs>
    <filter id="tcs-research-for-researchers-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-research-for-researchers:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-research-for-researchers{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-research-for-researchers{color-scheme:light}
    .tcs-research-for-researchers .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-research-for-researchers .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-research-for-researchers .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-research-for-researchers .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-for-researchers .ink-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-for-researchers .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="158" rx="44" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-research-for-researchers-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="line" d="M44 70 V122 M156 70 V122" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="62" y="56" width="76" height="92" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="ink-box" x="84" y="49" width="32" height="14" rx="5" fill="#ffffff" stroke="#2f5ea8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink" cx="100" cy="84" r="8" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ink" d="M87 107 Q87 97 100 97 Q113 97 113 107" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M80 120 H120 M80 133 H106" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
