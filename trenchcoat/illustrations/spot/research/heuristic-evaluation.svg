<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-research-heuristic-evaluation">
  <title>Heuristic Evaluation</title>
  <defs>
    <filter id="tcs-research-heuristic-evaluation-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-research-heuristic-evaluation:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-research-heuristic-evaluation{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-research-heuristic-evaluation{color-scheme:light}
    .tcs-research-heuristic-evaluation .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-research-heuristic-evaluation .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-research-heuristic-evaluation .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-research-heuristic-evaluation .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-research-heuristic-evaluation .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-heuristic-evaluation .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="108" cy="156" rx="42" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-research-heuristic-evaluation-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="line-fill" cx="46" cy="52" r="3.5" fill="#e6e9ee"/><circle class="line-fill" cx="58" cy="52" r="3.5" fill="#e6e9ee"/><circle class="line-fill" cx="70" cy="52" r="3.5" fill="#e6e9ee"/><path class="line" style="stroke-width:2" d="M30 64 H170" fill="none" stroke="#e6e9ee" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="mark" x="62" y="74" width="92" height="66" rx="10" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M72 90 L77 95 L85 86 M72 108 L77 113 L85 104 M73 121 L83 131 M83 121 L73 131" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:3.5" d="M96 90 H140 M96 108 H132 M96 126 H136" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M44 82 V128" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
