<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-research-hcd-research">
  <title>HCD Research</title>
  <defs>
    <filter id="tcs-research-hcd-research-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-research-hcd-research:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-research-hcd-research{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-research-hcd-research{color-scheme:light}
    .tcs-research-hcd-research .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-research-hcd-research .line{stroke:light-dark(#e6e9ee,#44464d)}
    .tcs-research-hcd-research .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-research-hcd-research .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-hcd-research .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="96" cy="156" rx="42" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-research-hcd-research-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="line" d="M132 62 H152 M140 78 H152" fill="none" stroke="#e6e9ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" style="stroke-width:10" d="M116 116 L140 140" fill="none" stroke="#2f5ea8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="mark" cx="92" cy="92" r="32" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink" cx="92" cy="84" r="8" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ink" d="M78 107 Q78 97 92 97 Q106 97 106 107" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
