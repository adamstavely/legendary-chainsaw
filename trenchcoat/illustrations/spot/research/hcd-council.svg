<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-research-hcd-council">
  <title>HCD Council</title>
  <defs>
    <filter id="tcs-research-hcd-council-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-research-hcd-council:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-research-hcd-council{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-research-hcd-council{color-scheme:light}
    .tcs-research-hcd-council .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-research-hcd-council .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-research-hcd-council .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-research-hcd-council .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-hcd-council .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="100" cy="152" rx="52" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-research-hcd-council-glow)"/>
  <rect class="tile" x="30" y="40" width="140" height="112" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <circle class="sub-box" cx="60" cy="70" r="10" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="sub-box" d="M44 108 Q44 86 60 86 Q76 86 76 108 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="sub-box" cx="140" cy="70" r="10" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="sub-box" d="M124 108 Q124 86 140 86 Q156 86 156 108 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="sub-box" cx="100" cy="60" r="10" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="sub-box" d="M84 98 Q84 76 100 76 Q116 76 116 98 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse class="mark" cx="100" cy="118" rx="58" ry="22" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M86 118 L96 127 L114 109" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
