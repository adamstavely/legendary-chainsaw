<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-research-research-insights">
  <title>Research Insights</title>
  <defs>
    <filter id="tcs-research-research-insights-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-research-research-insights:root{color-scheme:light dark}
