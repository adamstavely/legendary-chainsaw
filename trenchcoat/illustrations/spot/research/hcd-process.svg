<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="tcs-research-hcd-process">
  <title>HCD Process</title>
  <defs>
    <filter id="tcs-research-hcd-process-glow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <style>
    svg.tcs-research-hcd-process:root{color-scheme:light dark}
    :where(.dark,[data-theme="dark"],[data-tc-theme="dark"]) .tcs-research-hcd-process{color-scheme:dark}
    :where(.light,[data-theme="light"],[data-tc-theme="light"]) .tcs-research-hcd-process{color-scheme:light}
    .tcs-research-hcd-process .tile{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#e4e7ec,rgba(255,255,255,0.1))}
    .tcs-research-hcd-process .line-fill{fill:light-dark(#e6e9ee,#44464d)}
    .tcs-research-hcd-process .sub-box{fill:light-dark(#ffffff,#2a2a2e);stroke:light-dark(#c9ced6,#5c5f67)}
    .tcs-research-hcd-process .mark{fill:light-dark(#dce8fb,#263a5c);stroke:light-dark(#8fb0e8,#6f93d1)}
    .tcs-research-hcd-process .ink{stroke:light-dark(#2f5ea8,#cfdffb)}
    .tcs-research-hcd-process .glow{fill:light-dark(rgba(120,160,230,0.22),rgba(120,160,230,0.11))}
    </style>
  </defs>
  <ellipse class="glow" cx="131" cy="154" rx="34" ry="9" fill="rgba(120,160,230,0.22)" filter="url(#tcs-research-hcd-process-glow)"/>
  <rect class="tile" x="30" y="44" width="140" height="104" rx="14" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <path class="sub-box" d="M40 96 L70 66 L100 96 L70 126 Z" fill="#ffffff" stroke="#c9ced6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="line-fill" cx="70" cy="96" r="5" fill="#e6e9ee"/>
  <path class="mark" d="M100 96 L130 66 L160 96 L130 126 Z" fill="#dce8fb" stroke="#8fb0e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink" d="M116 96 H142 M135 89 L142 96 L135 103" fill="none" stroke="#2f5ea8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
