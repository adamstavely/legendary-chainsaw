name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: CSS prefix collisions
        run: npm run check:prefixes
      - name: Ratchet on risky patterns
        run: npm run check:ratchet
      - name: Design tokens
        run: npm run check:tokens
      - name: Tests
        run: npm test
