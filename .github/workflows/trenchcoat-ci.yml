name: Trenchcoat CI

# Runs only for changes under trenchcoat/, the agent-face source it bundles (and to this file); nothing else in the repo triggers it
on:
  push:
    branches: [main]
    paths:
      - "trenchcoat/**"
      - "agent-face/src/**"
      - ".github/workflows/trenchcoat-ci.yml"
  pull_request:
    paths:
      - "trenchcoat/**"
      - "agent-face/src/**"
      - ".github/workflows/trenchcoat-ci.yml"

# A newer push to the same branch cancels the run it replaces
concurrency:
  group: trenchcoat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trenchcoat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trenchcoat/package-lock.json
      - run: npm ci
      # Playwright's browsers are cached per version; the system libraries they need are installed either way
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Chromium cache
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Chromium
        run: npx playwright install --with-deps chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - name: Chromium system libraries
        run: npx playwright install-deps chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
      # The same checks as `npm run ci`, one step each so a failure is named on the PR; fast ones first
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: CSS prefix collisions
        run: npm run check:prefixes
      - name: Ratchet on risky patterns
        run: npm run check:ratchet
      # The DTCG export is checked against what Chromium computes from tokens.css, in each look and theme
      - name: Design tokens
        run: npm run check:tokens
      - name: Contrast
        run: npm run check:contrast
      - name: Generated element entry points
        run: node scripts/gen-elements.mjs --check
      # The wrappers are current, build with ngc, and strict templates check them (and catch five common mistakes)
      - name: Angular wrappers
        run: npm run check:angular
      # The components a model can place: their schemas, catalogue and registry are current
      - name: Generative UI schemas
        run: npm run check:generative
      - name: Dead CSS
        run: npm run check:dead-css
      - name: Docs pages
        run: npm run check:docs
      - name: Lit templates
        run: npm run check:lit
      # The React components, the gallery and its docs, in jsdom; the Lit elements run in the jobs below
      - name: Tests (jsdom)
        run: npx vitest run --project react
      # Its own step so a build failure is named as one; the examples install the tarball it packs
      - name: Build and pack the package
        run: |
          npm run build:package
          rm -rf examples/.packed && mkdir -p examples/.packed
          npm pack --pack-destination examples/.packed
          mv examples/.packed/trenchcoat-*.tgz examples/.packed/trenchcoat.tgz
      - name: Framework examples (React, Next.js, Vue, Nuxt, Angular, Svelte, HTML)
        run: npm run examples -- --no-pack
      # Needs the examples/ apps installed by the step above
      - name: Framework snippets on the docs pages
        run: npm run check:snippets

  # The Lit elements in real browsers, one runner per browser: three engines on one two-core runner starved WebKit
  # of CPU (animations caught mid-way). WebKit's page also grows in memory over a long run of files and crashed
  # about two thirds of the way through on its own runner, once after 48 files of a third, and once in a sixth; its
  # files are split across eight runners
  elements:
    name: elements (${{ matrix.browser }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1/1 }
          - { browser: firefox, shard: 1/1 }
          - { browser: webkit, shard: 1/8 }
          - { browser: webkit, shard: 2/8 }
          - { browser: webkit, shard: 3/8 }
          - { browser: webkit, shard: 4/8 }
          - { browser: webkit, shard: 5/8 }
          - { browser: webkit, shard: 6/8 }
          - { browser: webkit, shard: 7/8 }
          - { browser: webkit, shard: 8/8 }
    defaults:
      run:
        working-directory: trenchcoat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trenchcoat/package-lock.json
      - run: npm ci
      # Playwright's browsers are cached per version; the system libraries they need are installed either way
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Browser cache
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
      - name: Browser system libraries
        run: npx playwright install-deps ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit == 'true'
      - name: Element tests
        run: npx vitest run --project elements --browser.name=${{ matrix.browser }} --shard=${{ matrix.shard }}
