name: Trenchcoat publish

# Publishes @adamstavely/trenchcoat to GitHub Packages with no manual steps: on a merge to main that touches
# trenchcoat/, it publishes package.json's version if that version isn't on the registry yet, then tags the commit
# trenchcoat-v<version>. Pushing a trenchcoat-v* tag by hand still works as a fallback (the tag must match the
# version).
#
# A broken package is never published, without running the ~45-minute suite twice: a merge to main can only land once
# its PR's required `ci-ok` check has passed, so a merge publishes after confirming that check on the merged PR. A
# commit on main with no PR whose ci-ok passed doesn't publish. A hand-pushed tag has no PR to vouch for it, so it
# still runs the full suite first
on:
  push:
    branches: [main]
    paths:
      - "trenchcoat/**"
      - ".github/workflows/trenchcoat-publish.yml"
    tags:
      - "trenchcoat-v*"

concurrency:
  group: trenchcoat-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # To find the merged PR and read its ci-ok check
      pull-requests: read
      checks: read
    defaults:
      run:
        working-directory: trenchcoat
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trenchcoat/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@adamstavely"
      # Decides whether to publish: the version must not be on the registry yet (a 404 means it isn't), and a
      # hand-pushed tag must match it
      - name: Version to publish
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "trenchcoat-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          if out="$(npm view "@adamstavely/trenchcoat@$version" version 2>&1)"; then
            if [ "$out" = "$version" ]; then
              echo "$version is already published; nothing to do"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "E404"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            echo "::error::couldn't check the registry for $version"
            exit 1
          fi
      # A merge: the PR it came from must have passed ci-ok, the check main requires. Its head is what CI ran on
      - name: The merged PR passed CI
        if: steps.version.outputs.publish == 'true' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0]')"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "::error::$GITHUB_SHA didn't come from a merged PR, so nothing vouches for it; publish with a tag instead"
            exit 1
          fi
          number="$(jq -r .number <<<"$pr")"
          head="$(jq -r .head.sha <<<"$pr")"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=ci-ok" --jq '[.check_runs[] | select(.status == "completed")][0].conclusion')"
          echo "PR #$number, head $head: ci-ok $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::PR #$number's ci-ok check didn't pass ($conclusion)"
            exit 1
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      # A hand-pushed tag runs the full suite (below): the element tests run in real browsers
      - name: Playwright browsers
        if: steps.version.outputs.publish == 'true' && github.ref_type == 'tag'
        run: npx playwright install --with-deps
      # check:snippets (in npm run ci) type-checks the docs' snippets inside the example apps, which install the
      # packed tarball: build and pack first, as trenchcoat-ci.yml does
      - name: Build and pack for the examples
        if: steps.version.outputs.publish == 'true' && github.ref_type == 'tag'
        run: |
          npm run build:package
          rm -rf examples/.packed && mkdir -p examples/.packed
          npm pack --pack-destination examples/.packed
          mv examples/.packed/adamstavely-trenchcoat-*.tgz examples/.packed/trenchcoat.tgz
      - name: Framework examples
        if: steps.version.outputs.publish == 'true' && github.ref_type == 'tag'
        run: npm run examples -- --no-pack
      - if: steps.version.outputs.publish == 'true' && github.ref_type == 'tag'
        run: npm run ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run build:package
      - if: steps.version.outputs.publish == 'true'
        run: npm publish
      # The tag marks the commit that was published. An existing tag is never moved: bump the version instead. A tag
      # pushed with GITHUB_TOKEN doesn't start another run
      - name: Tag the release
        if: steps.version.outputs.publish == 'true' && github.ref_type == 'branch'
        env:
          TAG: trenchcoat-v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::warning::$TAG already exists; left where it is"
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
