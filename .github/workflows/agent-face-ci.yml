name: Agent Face CI
# Runs only for changes under agent-face/ (and to this file)
on:
  push:
    branches: [main]
    paths:
      - "agent-face/**"
      - ".github/workflows/agent-face-ci.yml"
  pull_request:
    paths:
      - "agent-face/**"
      - ".github/workflows/agent-face-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-face
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-face/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run size
