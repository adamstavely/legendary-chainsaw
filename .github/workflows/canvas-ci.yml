name: Canvas CI
# The canvas reads Trenchcoat from source (its elements, docs examples, catalogue and thumbnails), so a Trenchcoat
# change can break it too: run for either
on:
  push:
    branches: [main]
    paths:
      - "canvas/**"
      - "trenchcoat/**"
      - ".github/workflows/canvas-ci.yml"
  pull_request:
    paths:
      - "canvas/**"
      - "trenchcoat/**"
      - ".github/workflows/canvas-ci.yml"

concurrency:
  group: canvas-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canvas/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Chromium
        run: npx playwright install --with-deps chromium
      # Unit tests, then the app in Chromium: keyboard use, every docs example mounting, and axe (WCAG 2.2 AA)
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
